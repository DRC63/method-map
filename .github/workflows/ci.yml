# Continuous integration. Runs on every push and pull request to main so a
# broken change is visible before it reaches production (Render auto-deploys
# main). Two jobs gate quality (backend + frontend tests); a third surfaces
# dependency advisories without blocking. Python 3.12 / Node 20 match the
# Dockerfile so CI exercises the same runtime as production.
#
# NOTE: GitHub Actions reports status but does not by itself stop a Render
# deploy. To make a red build actually block release, enable "Wait for CI to
# pass" (or PR-preview deploys) in the Render service settings.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref - saves minutes when pushing rapidly.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      # Runtime deps plus the dev-only test deps (pytest lives in -dev).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` installs exactly the lockfile - reproducible, unlike `npm install`.
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    # Advisories are surfaced for visibility but do NOT fail the build: a moderate
    # transitive advisory should not block every deploy, or the gate gets muted.
    # Dependabot (.github/dependabot.yml) raises the PRs that actually fix them.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python audit (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Node audit (npm audit, high+)
        working-directory: frontend
        run: npm audit --audit-level=high
